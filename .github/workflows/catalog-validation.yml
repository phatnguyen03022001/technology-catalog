name: Catalog validation

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 2' # Weekly UTC, best-effort

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Catalog schema and evidence hygiene
        run: python scripts/validate_catalog.py
      - name: Adversarial mutation regression tests
        run: python -m unittest discover -s tests -v
      - name: Evidence freshness report (UTC, non-blocking age warnings)
        run: python scripts/monitor_upstream.py
      - name: Weekly or manual read-only upstream release and OSV checks
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/monitor_upstream.py --check-upstream --security
