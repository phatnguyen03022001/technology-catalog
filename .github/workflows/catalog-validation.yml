name: Catalog validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Catalog schema and evidence hygiene
        run: python scripts/validate_catalog.py
      - name: Adversarial mutation regression tests
        run: python -m unittest discover -s tests -v
